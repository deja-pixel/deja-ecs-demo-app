name: Deploy to ECS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout the repo
      - name: Checkout repository
        uses: actions/checkout@v3

      # Step 2: Configure AWS credentials
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      # Step 3: Log in to ECR
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # Step 4: Build Docker image
      - name: Build Docker image
        run: |
          docker build -t deja-demo-app .
          docker tag deja-demo-app:latest 
614388036286.dkr.ecr.us-east-1.amazonaws.com/deja-demo-app:latest

      # Step 5: Push Docker image to ECR
      - name: Push Docker image to ECR
        run: |
          docker push 
614388036286.dkr.ecr.us-east-1.amazonaws.com/deja-demo-app:latest

      # Step 6: Deploy to ECS using task definition
      - name: Deploy to ECS
        uses: aws-actions/amazon-ecs-deploy-task-definition@v1
        with:
          task-definition: ecs-task-def.json
          service: deja-demo-app
          cluster: deja-demo-app-cluster
          wait-for-service-stability: true

